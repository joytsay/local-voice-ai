services:
  app:
    # JetPack's CSV-mode NVIDIA hook requires selecting the NVIDIA runtime
    # instead of Docker's generic `gpus: all` device request.
    runtime: nvidia
    environment:
      DEVICE: ${DEVICE:-cuda}
      NEMOTRON_DEVICE: ${NEMOTRON_DEVICE:-cpu}
      BLUEMAGPIE_DEVICE: ${BLUEMAGPIE_DEVICE:-cuda}
      LLAMA_CTX_SIZE: ${GPU_LLAMA_CTX_SIZE:-16384}
      LLAMA_N_GPU_LAYERS: ${GPU_LLAMA_N_GPU_LAYERS:-0}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
