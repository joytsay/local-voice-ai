x-nvidia-runtime: &nvidia-runtime
  runtime: nvidia
  ipc: host
  ulimits:
    memlock:
      soft: -1
      hard: -1
    stack:
      soft: 67108864
      hard: 67108864

services:
  app:
    <<: *nvidia-runtime
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  livekit:
    <<: *nvidia-runtime
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  gradio:
    <<: *nvidia-runtime
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  stt:
    <<: *nvidia-runtime
    build:
      target: ${STT_BUILD_TARGET:-whisper-diarization}
    environment:
      VOXBOX_DEVICE: ${VOXBOX_DEVICE:-cuda}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  tts:
    <<: *nvidia-runtime
    environment:
      BLUEMAGPIE_DEVICE: ${BLUEMAGPIE_DEVICE:-cuda}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  llm:
    <<: *nvidia-runtime
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  embedding:
    <<: *nvidia-runtime
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
