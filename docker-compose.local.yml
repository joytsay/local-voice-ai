x-local-source: &local-source
  volumes:
    - ./local_voice_ai:/app/local_voice_ai

services:
  app:
    container_name: ivr-app
    <<: *local-source
    volumes:
      - ./local_voice_ai:/app/local_voice_ai
      - ./phonebook.csv:/app/phonebook.csv:ro
      - type: bind
        source: ${MODELS_DIR:-./models}
        target: /models

  livekit:
    container_name: ivr-livekit

  gradio:
    container_name: ivr-gradio
    <<: *local-source
    volumes:
      - ./local_voice_ai:/app/local_voice_ai
      - ./knowledge:/app/knowledge:ro
      - ./docker/ragflow/import_wiki.py:/app/docker/ragflow/import_wiki.py:ro
      - type: bind
        source: ${MODELS_DIR:-./models}
        target: /models

  stt:
    container_name: ivr-stt
    <<: *local-source
    volumes:
      - ./local_voice_ai:/app/local_voice_ai
      - type: bind
        source: ${MODELS_DIR:-./models}
        target: /models

  tts:
    container_name: ivr-tts
    <<: *local-source
    volumes:
      - ./local_voice_ai:/app/local_voice_ai
      - type: bind
        source: ${MODELS_DIR:-./models}
        target: /models

  llm:
    container_name: ivr-llm
    volumes:
      - type: bind
        source: ${MODELS_DIR:-./models}
        target: /models

  embedding:
    container_name: ivr-embedding
    volumes:
      - type: bind
        source: ${MODELS_DIR:-./models}
        target: /models

  ragflow-cpu:
    container_name: ivr-ragflow
    image: local/ragflow:${RAGFLOW_REF:-v0.26.4}-arm64
    build:
      context: .
      dockerfile: docker/ragflow.Dockerfile
      args:
        RAGFLOW_REPOSITORY: ${RAGFLOW_REPOSITORY:-https://github.com/infiniflow/ragflow.git}
        RAGFLOW_REF: ${RAGFLOW_REF:-v0.26.4}
