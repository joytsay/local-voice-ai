services:
  app:
    build:
      context: .
      args:
        # CPU is the default. For GPU:
          # LLAMA_MODEL_PATH=/models/llama.cpp/Qwen3-4B-Instruct-2507-UD-IQ1_S.gguf \
          # LLAMA_MODEL=qwen3-4b \
          # LLAMA_MODEL_ALIAS=qwen3-4b \
          # STT_PROVIDER=whisper \
          # STT_LANGUAGE=zh \
          # VOXBOX_DEVICE=cuda \
          # VOXBOX_MODEL_PATH=/models/voxbox/cache/huggingface/models--Systran--faster-whisper-small/snapshots/536b0662742c02347bc0e980a01041f333bce120 \
          # BLUEMAGPIE_DEVICE=cuda \
          # BLUEMAGPIE_MODEL_NAME=/models/hub/models--OpenFormosa--BlueMagpie-TTS/snapshots/78b3cbe95ed6f3097a07b5894444998c3f879075 \
          # LLAMA_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda-b7205 \
          # PYTHON_BASE=nvidia/cuda:12.4.1-runtime-ubuntu22.04 \
          # TORCH_INDEX_URL=https://download.pytorch.org/whl/cu124 \
          # GPU_LLAMA_N_GPU_LAYERS=3 \
          # COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml:docker-compose.local.yml \
          # docker compose up --build
        LLAMA_IMAGE: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
        LIVEKIT_IMAGE: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    env_file:
      - .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://127.0.0.1:7880}
      LIVEKIT_AGENT_URL: ${LIVEKIT_AGENT_URL:-ws://127.0.0.1:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-127.0.0.1}
      ECHO_MODE: ${ECHO_MODE:-0}
      SERVICE_BIND_HOST: ${SERVICE_BIND_HOST:-127.0.0.1}
      MANAGE_LLAMA: ${MANAGE_LLAMA:-0}
      STT_PROVIDER: ${STT_PROVIDER:-whisper}
      STT_LANGUAGE: ${STT_LANGUAGE:-auto}
      VOXBOX_DEVICE: ${VOXBOX_DEVICE:-cuda}
      NEMOTRON_LANGUAGE: ${NEMOTRON_LANGUAGE:-zh-CN}
      TTS_PROVIDER: ${TTS_PROVIDER:-bluemagpie}
      TTS_VOICE: ${TTS_VOICE:-chinese_female}
      BLUEMAGPIE_DEVICE: ${BLUEMAGPIE_DEVICE:-cuda}
      BLUEMAGPIE_MODEL_NAME: ${BLUEMAGPIE_MODEL_NAME:-OpenFormosa/BlueMagpie-TTS}
      BLUEMAGPIE_FORCE_VOICE: ${BLUEMAGPIE_FORCE_VOICE:-}
      BLUEMAGPIE_CFG_VALUE: ${BLUEMAGPIE_CFG_VALUE:-2.8}
      BLUEMAGPIE_INFERENCE_TIMESTEPS: ${BLUEMAGPIE_INFERENCE_TIMESTEPS:-9}
      BLUEMAGPIE_SEED: ${BLUEMAGPIE_SEED:-1729}
      LLAMA_HF_REPO: ${LLAMA_HF_REPO:-unsloth/Qwen3-4B-Instruct-2507-GGUF}
      LLAMA_MODEL: ${LLAMA_MODEL:-qwen3-4b}
      LLAMA_MODEL_ALIAS: ${LLAMA_MODEL_ALIAS:-qwen3-4b}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-16384}
      LLAMA_N_GPU_LAYERS: ${LLAMA_N_GPU_LAYERS:-0}
      DEVICE: ${DEVICE:-cuda}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      VOXBOX_MODEL_PATH: ${VOXBOX_MODEL_PATH:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
      - "${GRADIO_PORT:-7860}:7860"
      - "${LIVEKIT_BIND_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_PORT:-7881}:7881"
      # WebRTC media over UDP. The host port must equal the container port
      # because LiveKit advertises this exact port in its ICE candidates.
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"
    volumes:
      - ./local_voice_ai:/app/local_voice_ai:ro
      - /home/joy/Git/local-voice-ai/models:/models
      - /home/joy/Git/local-voice-ai/models/voxbox:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  models:
