include:
  - path: https://github.com/infiniflow/ragflow.git#v0.26.4:docker/docker-compose.yml

services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim}
        NODE_IMAGE: ${NODE_IMAGE:-node:20-slim}
    restart: unless-stopped
    environment:
      ECHO_MODE: ${ECHO_MODE:-0}
      DEVICE: ${DEVICE:-cuda}
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://livekit:7880}
      LIVEKIT_AGENT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      STT_PROVIDER: ${STT_PROVIDER:-whisper}
      STT_LANGUAGE: ${STT_LANGUAGE:-zh}
      STT_BASE_URL: http://stt:8000/v1
      TTS_BASE_URL: http://tts:8880/v1
      LLM_BASE_URL: http://llm:8080/v1
      MANAGE_LIVEKIT: "0"
      MANAGE_STT: "0"
      MANAGE_TTS: "0"
      MANAGE_LLM: "0"
      MANAGE_GRADIO: "0"
    volumes:
      - type: volume
        source: models
        target: /models
        volume:
          nocopy: true
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      livekit:
        condition: service_started

  livekit:
    build:
      context: .
      dockerfile: docker/livekit.Dockerfile
      args:
        LIVEKIT_IMAGE: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
    restart: unless-stopped
    command:
      - --dev
      - --bind
      - 0.0.0.0
      - --port
      - "7880"
      - --rtc.tcp_port
      - "7881"
      - --udp-port
      - "7882"
      - --node-ip
      - ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"

  gradio:
    build:
      context: .
      dockerfile: docker/gradio.Dockerfile
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim}
    restart: unless-stopped
    environment:
      STT_PROVIDER: ${STT_PROVIDER:-whisper}
      STT_BASE_URL: http://stt:8000/v1
      STT_LANGUAGE: ${STT_LANGUAGE:-zh}
      STT_DENOISE_ENABLED: ${STT_DENOISE_ENABLED:-1}
      LLM_MODEL_PATH: ${LLM_MODEL_PATH:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_HF_REPO: ${LLM_HF_REPO:-}
      LLM_PUBLIC_PORT: ${LLM_PORT:-11434}
      KB_PATH: /app/knowledge/system-prompt.md
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://ragflow-cpu:9380}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      RAGFLOW_DATASET_IDS: ${RAGFLOW_DATASET_IDS:-}
      RAGFLOW_PAGE_SIZE: ${RAGFLOW_PAGE_SIZE:-8}
      RAGFLOW_SIMILARITY_THRESHOLD: ${RAGFLOW_SIMILARITY_THRESHOLD:-0.2}
      RAGFLOW_VECTOR_WEIGHT: ${RAGFLOW_VECTOR_WEIGHT:-0.3}
      RAGFLOW_MAX_CONTEXT_CHARS: ${RAGFLOW_MAX_CONTEXT_CHARS:-12000}
      VOXBOX_HF_REPO: ${VOXBOX_HF_REPO:-Systran/faster-whisper-small}
      STT_MODEL_OPTIONS: ${STT_MODEL_OPTIONS:-}
      STT_MODEL_ROOTS: ${STT_MODEL_ROOTS:-/models/whisper,/models/voxbox/cache/huggingface}
      TTS_VOICE: ${TTS_VOICE:-hung_yi_lee}
      GRADIO_BROWSER_STATE_KEY: ${GRADIO_BROWSER_STATE_KEY:-local-voice-ai-settings-v1}
      GRADIO_BROWSER_STATE_SECRET: ${GRADIO_BROWSER_STATE_SECRET:-local-voice-ai-browser-state-v1}
    volumes:
      - type: volume
        source: models
        target: /models
        volume:
          nocopy: true
    ports:
      - "${GRADIO_PORT:-7860}:7860"
    networks:
      - default
      - ragflow

  stt:
    build:
      context: .
      dockerfile: docker/stt.Dockerfile
      target: ${STT_BUILD_TARGET:-whisper}
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim}
        DIARIZATION_PYTHON_BASE: ${DIARIZATION_PYTHON_BASE:-nvcr.io/nvidia/pytorch:24.07-py3-igpu}
        INSTALL_JETSON_INFERENCE: ${INSTALL_JETSON_INFERENCE:-0}
        CTRANSLATE2_VERSION: ${CTRANSLATE2_VERSION:-4.5.0}
        CUDA_ARCH_LIST: ${CUDA_ARCH_LIST:-Auto}
        CUDA_TOOLKIT_ROOT_DIR: ${CUDA_TOOLKIT_ROOT_DIR:-/usr/local/cuda}
        TORCHAUDIO_VERSION: ${TORCHAUDIO_VERSION:-2.4.0}
        DEEPFILTER_VERSION: ${DEEPFILTER_VERSION:-0.5.6}
    restart: unless-stopped
    environment:
      STT_PROVIDER: ${STT_PROVIDER:-whisper}
      STT_LANGUAGE: ${STT_LANGUAGE:-zh}
      STT_BIND_PORT: "8000"
      VOXBOX_DEVICE: ${VOXBOX_DEVICE:-cpu}
      VOXBOX_COMPUTE_TYPE: ${VOXBOX_COMPUTE_TYPE:-}
      VOXBOX_MODEL_PATH: ${VOXBOX_MODEL_PATH:-}
      VOXBOX_MODEL_PATH_STRICT: ${VOXBOX_MODEL_PATH_STRICT:-0}
      VOXBOX_HF_REPO: ${VOXBOX_HF_REPO:-Systran/faster-whisper-small}
      VOXBOX_DOWNLOAD_ROOT: ${VOXBOX_DOWNLOAD_ROOT:-/models/whisper}
      STT_MODEL_ROOTS: ${STT_MODEL_ROOTS:-/models/whisper,/models/voxbox/cache/huggingface}
      STT_DENOISE_ENABLED: ${STT_DENOISE_ENABLED:-1}
      STT_DENOISE_BINARY: ${STT_DENOISE_BINARY:-/usr/local/bin/deep-filter}
      STT_DENOISE_MODEL: ${STT_DENOISE_MODEL:-/opt/deepfilter/DeepFilterNet3_onnx.tar.gz}
      STT_DENOISE_POST_FILTER: ${STT_DENOISE_POST_FILTER:-0}
      STT_DENOISE_TIMEOUT: ${STT_DENOISE_TIMEOUT:-120}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: ${HF_HOME:-/models/huggingface}
      STT_DIARIZATION_ENABLED: ${STT_DIARIZATION_ENABLED:-0}
      STT_DIARIZATION_MODEL: ${STT_DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      STT_DIARIZATION_DEVICE: ${STT_DIARIZATION_DEVICE:-cuda:0}
      STT_DIARIZATION_MAX_GAP: ${STT_DIARIZATION_MAX_GAP:-1.0}
      CUDA_MODULE_LOADING: ${CUDA_MODULE_LOADING:-LAZY}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    volumes:
      - type: volume
        source: models
        target: /models
        volume:
          nocopy: true
    ports:
      - "${STT_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  tts:
    build:
      context: .
      dockerfile: docker/tts.Dockerfile
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu124}
        PRESERVE_BASE_TORCH: ${PRESERVE_BASE_TORCH:-0}
    restart: unless-stopped
    environment:
      BLUEMAGPIE_DEVICE: ${BLUEMAGPIE_DEVICE:-cuda}
      BLUEMAGPIE_CLONE_DEVICE: ${BLUEMAGPIE_CLONE_DEVICE:-cuda:0}
      BLUEMAGPIE_MODEL_NAME: ${BLUEMAGPIE_MODEL_NAME:-OpenFormosa/BlueMagpie-TTS}
      BLUEMAGPIE_DEFAULT_VOICE: ${TTS_VOICE:-hung_yi_lee}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - type: volume
        source: models
        target: /models
        volume:
          nocopy: true
    ports:
      - "${TTS_PORT:-8800}:8880"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8880/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  llm:
    build:
      context: .
      dockerfile: ${LLM_DOCKERFILE:-docker/llm.Dockerfile}
      args:
        LLAMA_IMAGE: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
        LLAMA_JETSON_BASE: ${LLAMA_JETSON_BASE:-nvcr.io/nvidia/pytorch:24.07-py3-igpu}
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-b7205}
        LLAMA_CPP_CUDA_ARCHITECTURES: ${LLAMA_CPP_CUDA_ARCHITECTURES:-87}
    profiles: ["llm"]
    restart: unless-stopped
    environment:
      LLM_MODEL_PATH: ${LLM_MODEL_PATH:-}
      LLM_HF_REPO: ${LLM_HF_REPO:-bartowski/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M}
      LLM_MODEL: ${LLM_MODEL:-}
      GPU_LLAMA_N_GPU_LAYERS: ${GPU_LLAMA_N_GPU_LAYERS:-}
    volumes:
      - type: volume
        source: models
        target: /models
        volume:
          nocopy: true
    ports:
      - "${LLM_PORT:-11434}:8080"

volumes:
  models:
